<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MartianHub | Explore Mars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/alien.svg" />
    <link rel="preload" as="image" href="assets/nicolas.jpg" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="nav-brand">MartianHub 🌕</div>
        <button class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a href="#" class="nav-link active" data-tab="apod">APOD</a></li>
          <li><a href="#" class="nav-link" data-tab="mars">Mars Rovers</a></li>
          <li>
            <a href="#" class="nav-link" data-tab="favorites">Favorites</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="apod">APOD</button>
      <button class="tab-btn" data-tab="mars">Mars Rovers</button>
      <button class="tab-btn" data-tab="favorites">Favorites</button>
    </div>
    <div class="tab-content">
      <div id="apod-tab" class="tab-pane active">
        <div class="apod-wrapper">
          <div id="apod-content">
            <div class="loading">
              <div class="spinner"></div>
              <p>The Picture of the Day</p>
            </div>
          </div>
        </div>
      </div>
      <div id="mars-tab" class="tab-pane">
        <div class="filters">
          <select id="rover-select">
            <option value="curiosity">Curiosity</option>
            <option value="perseverance">Perseverance</option>
          </select>
          <button id="mars-search-btn">Search</button>
        </div>
        <div id="mars-content">
          <div class="empty-state">
            <p>Select a rover and search to view 🔭📸🌄🔥</p>
          </div>
        </div>
      </div>
      <div id="favorites-tab" class="tab-pane">
        <div class="favorites-content">
          <div class="empty-state">
            <p>Like some pictures to see them here!</p>
          </div>
        </div>
      </div>
    </div>
    <div id="imageModal" class="modal">
      <span class="close">&times;</span>
      <img class="modal-content" id="expandedImage" />
    </div>
    <script src="script.js"></script>
  </body>
</html>
